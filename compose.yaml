services:
  canvaslab:
    build: .
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      CANVASLAB_API_URL: ${CANVASLAB_API_URL:-https://txsyyhcrtasrqodtvpvn.supabase.co/functions/v1/canvaslab-api}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      TRUST_PROXY: ${TRUST_PROXY:-false}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
